<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" fill="none">
  <!-- Road / Ground -->
  <ellipse cx="160" cy="108" rx="155" ry="10" fill="#041A30" opacity="0.5"/>
  <path d="M10 102 Q160 98 310 102 L310 112 L10 112 Z" fill="#0A2540" opacity="0.6"/>
  <!-- Road center dashes -->
  <rect x="20" y="104" width="22" height="3" rx="1.5" fill="#FACC15" opacity="0.7"/>
  <rect x="58" y="104" width="22" height="3" rx="1.5" fill="#FACC15" opacity="0.7"/>
  <rect x="96" y="104" width="22" height="3" rx="1.5" fill="#FACC15" opacity="0.7"/>
  <rect x="134" y="104" width="22" height="3" rx="1.5" fill="#FACC15" opacity="0.7"/>
  <rect x="172" y="104" width="22" height="3" rx="1.5" fill="#FACC15" opacity="0.7"/>
  <rect x="210" y="104" width="22" height="3" rx="1.5" fill="#FACC15" opacity="0.7"/>
  <rect x="248" y="104" width="22" height="3" rx="1.5" fill="#FACC15" opacity="0.7"/>
  <rect x="286" y="104" width="22" height="3" rx="1.5" fill="#FACC15" opacity="0.7"/>

  <!-- Bus Body -->
  <rect x="38" y="22" width="230" height="78" rx="10" fill="#F8FAFC"/>
  <!-- Bus roof curve -->
  <rect x="38" y="22" width="230" height="14" rx="8" fill="#E2E8F0"/>
  <!-- Blue accent stripe along body -->
  <rect x="38" y="58" width="230" height="8" fill="#1D4ED8" opacity="0.85"/>
  <!-- Bottom skirt / undercarriage -->
  <rect x="42" y="90" width="222" height="8" rx="3" fill="#CBD5E1"/>

  <!-- Front face -->
  <rect x="248" y="22" width="20" height="78" rx="0" fill="#E2E8F0"/>
  <path d="M248 22 Q268 24 268 36 L268 90 L248 90 Z" fill="#E2E8F0"/>
  <!-- Front windshield -->
  <path d="M252 26 L266 29 L266 50 L252 50 Z" rx="3" fill="#BFDBFE" opacity="0.8"/>
  <!-- Front grille/bumper -->
  <rect x="252" y="80" width="14" height="8" rx="2" fill="#94A3B8"/>
  <!-- Headlight front -->
  <rect x="254" y="62" width="10" height="6" rx="2" fill="#FEF3C7"/>
  <rect x="254" y="69" width="10" height="4" rx="1" fill="#FACC15" opacity="0.8"/>

  <!-- Rear face -->
  <path d="M38 22 Q28 26 28 38 L28 88 L38 88 Z" fill="#CBD5E1"/>
  <!-- Rear window -->
  <path d="M28 42 L38 40 L38 60 L28 62 Z" fill="#BFDBFE" opacity="0.6"/>
  <!-- Rear lights -->
  <rect x="28" y="68" width="8" height="6" rx="1" fill="#FCA5A5" opacity="0.9"/>

  <!-- Side windows - upper deck -->
  <rect x="52" y="28" width="26" height="20" rx="4" fill="#BFDBFE" opacity="0.9"/>
  <rect x="84" y="28" width="26" height="20" rx="4" fill="#BFDBFE" opacity="0.9"/>
  <rect x="116" y="28" width="26" height="20" rx="4" fill="#BFDBFE" opacity="0.9"/>
  <rect x="148" y="28" width="26" height="20" rx="4" fill="#BFDBFE" opacity="0.9"/>
  <rect x="180" y="28" width="26" height="20" rx="4" fill="#BFDBFE" opacity="0.9"/>
  <rect x="212" y="28" width="26" height="20" rx="4" fill="#BFDBFE" opacity="0.9"/>

  <!-- Window dividers / frames -->
  <rect x="52" y="28" width="2" height="20" rx="1" fill="#93C5FD" opacity="0.5"/>
  <rect x="84" y="28" width="2" height="20" rx="1" fill="#93C5FD" opacity="0.5"/>
  <rect x="116" y="28" width="2" height="20" rx="1" fill="#93C5FD" opacity="0.5"/>
  <rect x="148" y="28" width="2" height="20" rx="1" fill="#93C5FD" opacity="0.5"/>

  <!-- Door -->
  <rect x="68" y="66" width="22" height="24" rx="3" fill="#CBD5E1" stroke="#94A3B8" stroke-width="1"/>
  <rect x="70" y="68" width="9" height="20" rx="2" fill="#E2E8F0"/>
  <rect x="80" y="68" width="9" height="20" rx="2" fill="#E2E8F0"/>
  <!-- Door handle -->
  <rect x="78" y="77" width="4" height="2" rx="1" fill="#64748B"/>

  <!-- Destination board on front top -->
  <rect x="100" y="24" width="98" height="10" rx="2" fill="#1E3A8A"/>
  <text x="149" y="32" text-anchor="middle" fill="#FFFFFF" font-size="6" font-family="Arial" font-weight="bold">CHARVIK EXPRESS</text>

  <!-- Wheels -->
  <!-- Rear wheel pair -->
  <circle cx="78" cy="98" r="12" fill="#1E293B"/>
  <circle cx="78" cy="98" r="7" fill="#475569"/>
  <circle cx="78" cy="98" r="3" fill="#94A3B8"/>
  <!-- Hub bolts -->
  <circle cx="78" cy="91" r="1.2" fill="#94A3B8"/>
  <circle cx="85" cy="98" r="1.2" fill="#94A3B8"/>
  <circle cx="78" cy="105" r="1.2" fill="#94A3B8"/>
  <circle cx="71" cy="98" r="1.2" fill="#94A3B8"/>

  <!-- Front wheel -->
  <circle cx="230" cy="98" r="12" fill="#1E293B"/>
  <circle cx="230" cy="98" r="7" fill="#475569"/>
  <circle cx="230" cy="98" r="3" fill="#94A3B8"/>
  <circle cx="230" cy="91" r="1.2" fill="#94A3B8"/>
  <circle cx="237" cy="98" r="1.2" fill="#94A3B8"/>
  <circle cx="230" cy="105" r="1.2" fill="#94A3B8"/>
  <circle cx="223" cy="98" r="1.2" fill="#94A3B8"/>

  <!-- Undercarriage beam -->
  <rect x="62" y="88" width="186" height="6" rx="2" fill="#CBD5E1"/>

  <!-- Roof AC unit -->
  <rect x="130" y="16" width="50" height="8" rx="3" fill="#CBD5E1"/>
  <rect x="140" y="14" width="30" height="4" rx="2" fill="#94A3B8"/>

  <!-- Side mirror -->
  <rect x="262" y="38" width="10" height="6" rx="2" fill="#94A3B8"/>
  <line x1="268" y1="38" x2="272" y2="34" stroke="#94A3B8" stroke-width="1.5"/>
</svg>
